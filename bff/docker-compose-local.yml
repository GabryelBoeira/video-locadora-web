services:
  bff:
    container_name: bff
    build:
      context: .
      dockerfile: Dockerfile
    image: bff
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "5083:5083"
    env_file:
      - .env
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: always
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5083
    mem_limit: 800m
    mem_reservation: 400m
    networks:
      - locadora-net

networks:
  locadora-net:
    external: true
