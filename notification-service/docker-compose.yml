services:
  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    image: notification-service
    restart: always
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "8082:8082"
    networks:
      - locadora-net

networks:
  locadora-net:
    driver: bridge