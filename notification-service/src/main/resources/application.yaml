server:
  port: 8082

spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "*"
    listener:
      ack-mode: manual

app:
  kafka:
    topics:
      domain-events: ${APP_KAFKA_DOMAIN_EVENTS_TOPIC:videolocadora.domain-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
