services:
  db:
    container_name: mysql
    image: mysql:8
    restart: always
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${MYSQL_DB_PASSWORD}
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-proot" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - locadora-net

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:latest
    command: start-dev --import-realm
    restart: always
    env_file:
      - .env
    environment:
      KC_DB: mysql
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 3306
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_URL_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    mem_limit: 750m
    mem_reservation: 350m
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      db:
        condition: service_healthy
    networks:
      - locadora-net

  kafka:
    container_name: kafka
    image: apache/kafka:latest
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    mem_limit: 1024m
    mem_reservation: 512m
    depends_on:
      db:
        condition: service_healthy
    networks:
      - locadora-net

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    mem_limit: 512m
    depends_on:
      - kafka
    networks:
      - locadora-net

  video-locadora:
    container_name: video-locadora
    build:
      context: ../video-locadora
      dockerfile: Dockerfile
    image: videolocadora
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5080:5080"
    env_file:
      - .env-video-locadora
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: always
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080
    mem_limit: 1024m
    mem_reservation: 512m
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - locadora-net

  bff:
    container_name: bff
    build:
      context: ../bff
      dockerfile: Dockerfile
    image: bff
    restart: unless-stopped
    ports:
      - "8083:8083"
      - "5083:5083"
    env_file:
      - .env-bff
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: always
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5083
    mem_limit: 800m
    mem_reservation: 400m
    depends_on:
      - keycloak
      - video-locadora
    networks:
      - locadora-net

  notification-service:
    container_name: notification-service
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    image: notification-service
    restart: always
    ports:
      - "8082:8082"
      - "5082:5082"
    env_file:
      - .env-notification-service
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: always
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: >
        --enable-native-access=ALL-UNNAMED
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5082
    mem_limit: 800m
    mem_reservation: 400m
    depends_on:
      - kafka
    networks:
      - locadora-net

volumes:
  mysql-data:

networks:
  locadora-net:
    name: locadora-net
    driver: bridge
