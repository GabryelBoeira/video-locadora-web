services:
  video-locadora:
    build:
      context: .
      dockerfile: Dockerfile
    image: videolocadora
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5080:5080"
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/videolocadora
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_URI: http://keycloak:8080/realms/video-locadora
      KEYCLOAK_CERTS_URI: http://keycloak:8080/realms/video-locadora/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - locadora-net

networks:
  locadora-net:
    external: true