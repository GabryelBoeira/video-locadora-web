services:
  video-locadora:
    container_name: video-locadora
    build:
      context: .
      dockerfile: Dockerfile
    image: videolocadora
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "5080:5080"
    env_file:
      - .env
    environment:
      SPRING_OUTPUT_ANSI_ENABLED: always
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: ${VIDEOLOCADORA_DATASOURCE_URL}/${VIDEOLOCADORA_DB_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${VIDEOLOCADORA_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${VIDEOLOCADORA_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_SERVER}
      KEYCLOAK_URI: ${KEYCLOAK_URI}
      KEYCLOAK_CERTS_URI: ${KEYCLOAK_CERTS_URI}
      JAVA_TOOL_OPTIONS: >
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080
    mem_limit: 1024m
    mem_reservation: 512m
    networks:
      - locadora-net

networks:
  locadora-net:
    external: true