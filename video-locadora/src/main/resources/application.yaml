server:
  port: 8080
  servlet:
    context-path: /videolocadora

spring:
  application:
    name: video-locadora
  servlet:
    encoding:
      force: true
  profiles:
    active: ${PROFILE:local,development}
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db.migration
    encoding: UTF-8
  messages:
    default-locale: pt-BR
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: true
  docker:
    compose:
      enabled: true
      file: docker-compose.yml
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI}
          jwk-set-uri: ${KEYCLOAK_CERTS_URI}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: 'openapi, swagger-ui'
app:
  cors:
   allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  kafka:
    topics:
      domain-events: ${SPRING_KAFKA_TOPICS_DOMAIN_EVENTS:videolocadora.domain-events}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: swagger-client

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
    org.springframework.web: DEBUG